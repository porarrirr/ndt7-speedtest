name: One-time license cleanup

on:
  push:
    paths:
      - .github/workflows/license-cleanup-release-assets.yml

permissions:
  contents: write

jobs:
  delete-targeted-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Delete pre-fix release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_ids=(512305750 512354676 512305804 356785549 356783842 356783835 356710262 356710200 356710184 356802118 356800056 356800474 356800046 356800463 356695633 356694424 356698470 356697984 356756763 356754192 356754183 356701115 356699725 356699705 356792185 356790491 356790488)
          for asset_id in "${asset_ids[@]}"; do
            echo "Deleting release asset ${asset_id}"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done
